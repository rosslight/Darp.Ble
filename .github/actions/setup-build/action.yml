name: Set up the build
description: Installs everything the solution needs to restore and build, including Darp.Ble.Android
runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'nuget.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget

    # Darp.Ble.Android builds with the Android workload, a JDK and the Android SDK
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    - name: Install workloads
      shell: bash
      run: dotnet workload install android
