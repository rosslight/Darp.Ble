name: release-please

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish again, e.g. v2.0.0-preview'
        required: true

permissions:
  contents: write       # required for tags + releases
  pull-requests: write  # required for release PRs

jobs:
  release-please:
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  publish:
    needs:
      - release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # required for NuGet trusted publishing
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install workloads
        run: |
          dotnet workload install android

      - name: Restore
        run: dotnet restore /p:EnableWindowsTargeting=true
      - name: Build
        run: dotnet build --configuration Release --no-restore /p:EnableWindowsTargeting=true
      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore

      - name: Pack
        run: |
          version="${RELEASE_TAG#v}"
          # The solution lists the libraries that are ported to 2.0
          dotnet pack --configuration Release --artifacts-path build/noncommercial /p:PackageLicenseFile=LICENSE.md /p:Version="$version"
          dotnet pack --configuration Release --artifacts-path build/commercial /p:PackageLicenseFile=LICENSE-COMMERCIAL.md /p:Version="$version"

      # The short-lived API key is valid for one hour, so request it right before pushing
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for pkg_name in build/noncommercial/package/release/*.nupkg; do
            dotnet nuget push "$pkg_name" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Push to Azure Artifacts
        env:
          AZURE_ARTIFACTS_FEED_URL: https://pkgs.dev.azure.com/rosslight-engineering/darp.ble/_packaging/darp.ble.subscription/nuget/v3/index.json
        run: |
          dotnet nuget add source "$AZURE_ARTIFACTS_FEED_URL" --name AzureFeed --username ${{ secrets.AZURE_USERNAME }} --password ${{ secrets.AZURE_DEVOPS_TOKEN }} --store-password-in-clear-text
          for pkg_name in build/commercial/package/release/*.nupkg; do
            dotnet nuget push "$pkg_name" --api-key AzureArtifacts --source AzureFeed --skip-duplicate
          done
