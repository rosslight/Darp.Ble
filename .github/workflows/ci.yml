name: Build and test

on:
  push:
    branches: [ "main" ]
  # Every target branch, so stacked pull requests are checked too
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      # Darp.Ble.Android builds with the Android workload, a JDK and the Android SDK
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install workloads
        run: dotnet workload install android

      - name: Check format
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Restore dependencies
        run:  dotnet restore /p:EnableWindowsTargeting=true
      - name: Build
        run: dotnet build --no-restore --configuration Release /p:EnableWindowsTargeting=true
      - name: Build examples
        run: |
          for example in examples/*.cs; do
            dotnet build "$example" --configuration Release
          done
      # Without the include filter, coverlet.MTP skips assemblies named like the test assembly,
      # e.g. Darp.Ble.HciHost for Darp.Ble.HciHost.Tests
      - name: Test
        run: |
          dotnet test --no-build --configuration Release \
            --coverlet --coverlet-output-format cobertura \
            --coverlet-include "[Darp.Ble*]*" --coverlet-exclude "[*.Tests]*" \
            --results-directory ./coverage-results

      - name: Post Coverage Report
        uses: rosslight/pr-code-coverage-visualizer@v2.2.1
        with:
          files: |
            coverage-results/**/coverage.cobertura*.xml
          exclude-files: |
            *.g.cs
