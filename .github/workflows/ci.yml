name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install workloads
        run: dotnet workload install android

      - name: Check format
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Restore dependencies
        run:  dotnet restore /p:EnableWindowsTargeting=true
      - name: Build
        run: dotnet build --no-restore --configuration Release /p:EnableWindowsTargeting=true
      - name: Test
        run: |
          dotnet test --no-build --configuration Release \
            --coverlet --coverlet-output-format cobertura \
            --results-directory ./coverage-results

      - name: Post Coverage Report
        uses: rosslight/pr-code-coverage-visualizer@v2.2.1
        with:
          files: |
            coverage-results/**/coverage.cobertura*.xml
          exclude-files: |
            *.g.cs
