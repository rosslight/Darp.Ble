name: Build and test

on:
  push:
    branches: [ "main" ]
  # Every target branch, so stacked pull requests are checked too
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build

      - name: Check format
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Restore dependencies
        run:  dotnet restore /p:EnableWindowsTargeting=true
      - name: Build
        run: dotnet build --no-restore --configuration Release /p:EnableWindowsTargeting=true
      - name: Build examples
        run: |
          for example in examples/*.cs; do
            dotnet build "$example" --configuration Release
          done
      - name: Pack
        run: dotnet pack --no-build --configuration Release --output packages
      - name: Check packages
        run: dotnet run tools/check-packages.cs -- "$(dotnet msbuild src/Darp.Ble -getProperty:Version)" packages
      # Without the include filter, coverlet.MTP skips assemblies named like the test assembly,
      # e.g. Darp.Ble.HciHost for Darp.Ble.HciHost.Tests
      # A backstop for a test that hangs; the tests' own watchdogs name what they waited for first
      - name: Test
        timeout-minutes: 10
        run: |
          dotnet test --no-build --configuration Release \
            --coverlet --coverlet-output-format cobertura \
            --coverlet-include "[Darp.Ble*]*" --coverlet-exclude "[*.Tests]*" \
            --results-directory ./coverage-results

      - name: Post Coverage Report
        uses: rosslight/pr-code-coverage-visualizer@v2.2.1
        with:
          files: |
            coverage-results/**/coverage.cobertura*.xml
          exclude-files: |
            *.g.cs
